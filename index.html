.side-logo .logo-text{font-size:15px;font-weight:600;line-height:1.3}

.nav-item{padding:10px 20px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:rgba(255,255,255,0.65);transition:all 0.2s;border-left:3px solid transparent}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.05)}
.nav-item.active{color:#fff;background:var(--primary);border-left-color:var(--accent)}
.nav-item .nav-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.nav-item .nav-badge{margin-left:auto;background:var(--accent);color:#000;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:52px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;justify-content:space-between;flex-shrink:0}
#topbar .page-title{font-size:16px;font-weight:600}
#topbar .user-info{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
#topbar .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
#content{flex:1;overflow-y:auto;padding:24px}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.card-row{display:flex;gap:16px;flex-wrap:wrap}
.card-row .card{flex:1;min-width:240px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-left:4px solid var(--primary)}
.kpi-card.accent{border-left-color:var(--accent)}.kpi-card.warn{border-left-color:#ff7a45}.kpi-card.purple{border-left-color:#9254de}
.kpi-card .kpi-val{font-size:28px;font-weight:700;color:var(--primary)}
.kpi-card.accent .kpi-val{color:var(--accent)}.kpi-card.warn .kpi-val{color:#ff7a45}.kpi-card.purple .kpi-val{color:#9254de}
.kpi-card .kpi-label{font-size:13px;color:var(--text2);margin-top:4px}
.kpi-card .kpi-change{font-size:12px;margin-top:4px}.kpi-card .kpi-change.up{color:#52c41a}
.banner{background:linear-gradient(135deg,#0a1628,#1a3a5c,#1677ff);border-radius:var(--radius);padding:32px;color:#fff;margin-bottom:24px;position:relative;overflow:hidden}
.banner::after{content:'';position:absolute;top:-30%;right:-10%;width:300px;height:300px;background:radial-gradient(circle,rgba(54,207,201,0.2),transparent 70%);border-radius:50%}
.banner h2{font-size:24px;margin-bottom:8px;position:relative;z-index:1}
.banner p{font-size:14px;opacity:0.85;position:relative;z-index:1;max-width:500px}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:#fafafa;padding:10px 12px;text-align:left;font-weight:600;border-bottom:2px solid var(--border);color:var(--text2);font-size:12px}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.data-table tr:hover td{background:var(--primary-light)}
.status-tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:11px;font-weight:500}
.status-tag.active{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.status-tag.pending{background:#fff7e6;color:#fa8c16;border:1px solid #ffd591}
.status-tag.done{background:#f0f5ff;color:var(--primary);border:1px solid #91caff}
.chat-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.2s}
.chat-item:hover{background:var(--primary-light)}

.chat-item .chat-time{font-size:11px;color:var(--text3);flex-shrink:0}
.chat-item .chat-badge{background:#ff4d4f;color:#fff;font-size:10px;padding:1px 7px;border-radius:10px}
.ai-chat{padding:20px;max-width:700px;margin:0 auto}
.ai-msg{margin-bottom:16px;display:flex;gap:10px}
.ai-msg.user{flex-direction:row-reverse}

.ai-msg.bot .ai-bubble{background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.ai-msg.user .ai-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.ai-input-area{display:flex;gap:10px;margin-top:20px;padding:12px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.ai-input-area input{flex:1;border:none;outline:none;font-size:14px;padding:8px}
.ai-input-area button{background:var(--primary);color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:14px}
.scene-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.scene-card{background:var(--card);border-radius:var(--radius);padding:20px 14px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:all 0.3s;border:1px solid transparent}

.scene-card .scene-desc{font-size:11px;color:var(--text3);line-height:1.5}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--card);border-radius:16px;padding:32px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.modal h3{font-size:20px;margin-bottom:16px}
.modal .close-btn{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text3)}
.tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--border)}
.tab{padding:10px 20px;cursor:pointer;font-size:14px;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.search-box{width:100%;padding:10px 16px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:16px;outline:none}
.search-box:focus{border-color:var(--primary)}
.tag{display:inline-block;background:var(--primary-light);color:var(--primary);border-radius:4px;padding:2px 8px;font-size:11px;margin-right:4px}

</style>

function renderModal(){var o=document.getElementById('modalOverlay');if(o)o.remove();if(!modalData)return;
  var d=document.createElement('div');d.className='modal-overlay';d.id='modalOverlay';d.onclick=function(e){if(e.target===this)closeModal();};

  var h3=document.createElement('h3');h3.textContent=modalData.title;m.appendChild(h3);

  d.appendChild(m);document.body.appendChild(d);
}

  el.innerHTML = '<div class="scene-grid">'+D.opcScenes.map(function(s){return '<div class="scene-card" onclick="showModal(\''+s.name+'\',\'<h4>'+s.icon+' '+s.name+'</h4><p><b>能力描述：</b>'+s.desc+'</p><p><b>适用对象：</b>'+s.target+'</p><p style=margin-top:12px;color:var(--text2);>该场景已接入A派科技园钉钉悟空OPC平台，入驻企业可直接在A派AI助手中激活使用。</p>\')"><div class="scene-icon">'+s.icon+'</div><div class="scene-name">'+s.name+'</div><div class="scene-desc">'+s.desc+'</div></div>';}).join('')+'</div>';
}

function render_enterprise(el){
  el.innerHTML = '<input class="search-box" placeholder="搜索入驻企业...">'+
    '<div class="card" style="padding:0;"><table class="data-table"><thead><tr><th>企业名称</th><th>行业</th><th>入驻时间</th><th>规模</th><th>状态</th><th>OPC场景</th><th>操作</th></tr></thead><tbody>'+D.enterprises.map(function(e){return '<tr><td><strong>'+e.name+'</strong></td><td>'+e.industry+'</td><td>'+e.since+'</td><td>'+e.scale+'</td><td>'+statusTag(e.status)+'</td><td>'+e.opc.map(function(o){return '<span class="tag">'+o+'</span>';}).join('')+'</td><td><a href="#" style="color:var(--primary);" onclick="showModal(\''+e.name+'\',\'<p><b>企业名称：</b>'+e.name+'</p><p><b>行业：</b>'+e.industry+'</p><p><b>入驻时间：</b>'+e.since+'</p><p><b>规模：</b>'+e.scale+'</p><p><b>联系人：</b>'+e.contact+'</p><p><b>状态：</b>'+statusTag(e.status)+'</p><p><b>OPC场景：</b>'+e.opc.join('\u3001')+'</p>\');return false;">详情</a></td></tr>';}).join('')+'</tbody></table></div>';
}

function render_investment(el){
  el.innerHTML = '<div class="card" style="padding:0;"><table class="data-table"><thead><tr><th>企业</th><th>轮次</th><th>金额</th><th>投资方</th><th>阶段</th><th>时间</th></tr></thead><tbody>'+D.investments.map(function(i){return '<tr><td><strong>'+i.company+'</strong></td><td>'+i.round+'</td><td>'+i.amount+'</td><td>'+i.investor+'</td><td>'+i.stage+'</td><td>'+i.date+'</td></tr>';}).join('')+'</tbody></table></div>';
}

// Init
document.querySelectorAll('.nav-item').forEach(function(el){
  el.addEventListener('click',function(){
    currentPage = this.getAttribute('data-page');
    renderApp();
  });
});
renderApp();
</script>
